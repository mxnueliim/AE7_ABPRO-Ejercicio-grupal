<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoFix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body>
    <!-- Título -->
    <h1 class="text-center m-3">AutoFix - Reparación de Vehículos a Domicilio</h1>

    <!-- Contenedor de las cards -->
    <div class="container-fluid" id="catalogo">
        <h2>Servicios y precios</h2>
        <div class="row ">
            <div class="col-sm-12 col-md-6 col-lg-4">
                <div class="card m-2">
                    <img src="..." class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="card-title">Cambio de aceite</h5>
                        <p class="card-text">Precio: $40.000 CLP</p>
                    </div>
                </div>
            </div>
            <div class="col-sm-12 col-md-6 col-lg-4">
                <div class="card m-2">
                    <img src="..." class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="card-title">Revisión de frenos</h5>
                        <p class="card-text">Precio: $60.000 CLP</p>
                    </div>
                </div>
            </div>
            <div class="col-sm-12 col-md-6 col-lg-4">
                <div class="card m-2">
                    <img src="..." class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="card-title">Diagnóstico eléctrico</h5>
                        <p class="card-text">Precio: $50.000 CLP</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- primer formulario de reparación con validación -->
    <div class="container-fluid" id="solicitudReparacion">
        <h2>Solicitar Reparación</h2>
        <div>
            <form id="formularioReparacion" class="row g-3 needs-validation" novalidate>
                <div class="col-12">
                    <label for="nombreCliente">Nombre del Cliente</label>
                    <input type="text" name="nombreCliente" id="nombreCliente" required>
                    <div class="invalid-feedback">Ingrese nombre</div>
                </div>
                <div class="col-12">
                    <label for="tipoReparacion">Nombre del Cliente</label>
                    <select name="tipoReparacion" id="tipoReparacion" required>
                        <option selected disabled value="">Seleccion un servicio</option>
                        <option value="1">Cambio de aceite</option>
                        <option value="2">Revisión de frenos</option>
                        <option value="3">Diagnóstico eléctrico</option>
                    </select>
                    <div class="invalid-feedback">Ingrese un servicio válido</div>
                </div>
                <div class="col-12">
                    <label for="descripcionReparacion">Descripción</label>
                    <textarea name="descripcionReparacion" id="descripcionReparacion" required></textarea>
                    <div class="invalid-feedback">Describa el problema</div>
                </div>
                <div class="col-12">
                    <label for="horarioReparacion">Agendar Cita</label>
                    <input type="datetime-local" name="horarioReparacion" id="horarioReparacion" required>
                    <div class="invalid-feedback">Seleccione un horario</div>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="./assets/js/script.js"></script>
</body>
</html>
